name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SecureDelete.sln

      - name: Build (Release)
        run: dotnet build SecureDelete.sln -c Release --no-restore

      - name: Test
        run: dotnet test SecureDelete.sln -c Release --no-build
